name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-and-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm run check
      - run: git diff --exit-code -- dist/nibe-flow-card.js nibe_flow/app/static/card.js
      - run: python -m pip install -r nibe_flow/requirements.txt
      - run: python -m unittest discover -s nibe_flow/tests -v
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-app.mjs
      - run: node scripts/check-boost.mjs
      - run: node scripts/check-boost.mjs
        env:
          BOOST_ASSET: nibe_flow/app/static/card.js
          BOOST_TAG: nibe-flow-card-v2
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: nibe_flow
          platforms: linux/amd64,linux/arm64
          push: false
