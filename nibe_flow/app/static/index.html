<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NIBE Flow · Wärmepumpe</title><style>html,body{margin:0;min-height:100%;background:#edf1f7;font-family:system-ui}body.dark{background:#0b1019}#status{padding:14px 20px;color:#20324d}body.dark #status{color:#cbd5e1}#status:empty{display:none}nibe-flow-card-v2{display:block}dialog{width:min(900px,90vw);padding:24px;border:0;border-radius:24px;background:#fff;color:#162238}body.dark dialog{background:#141e30;color:#e4eaf2}dialog::backdrop{background:#0009}dialog header{display:flex;justify-content:space-between;gap:20px}dialog h2{margin:0;font-size:20px}dialog button,#theme{border:0;border-radius:12px;min-height:44px;padding:8px 14px;cursor:pointer}#theme{position:fixed;right:12px;bottom:12px;z-index:3;background:#283c61;color:white}#historyChart{width:100%;height:260px;display:block}#historyStatus{color:#75869d;font-size:14px}</style></head><body><div id="status" role="status">Verbindung zu Home Assistant wird hergestellt …</div><div id="app"></div><button id="theme" aria-label="Farbmodus ändern">◐ Automatisch</button><dialog id="history"><header><h2 id="historyTitle"></h2><button id="historyClose" aria-label="Schließen">✕</button></header><p id="historyValue"></p><h3>Verlauf · 24 Stunden</h3><svg id="historyChart" role="img" aria-label="Messwertverlauf der letzten 24 Stunden"></svg><p id="historyStatus"></p></dialog><script type="module" src="app.js"></script></body></html>
